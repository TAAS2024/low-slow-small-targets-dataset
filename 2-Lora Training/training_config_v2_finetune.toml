# ============================================================================
# LoRA 微调配置 v2 — 商用无人机 (drn3_uav)  从 ckpt-5000 resume
# 目标：修复 45% 失败率（无桨叶/结构崩坏/桨叶融合）
# ============================================================================

# ── 基础模型 ──────────────────────────────────────
pretrained_model_name_or_path = "runwayml/stable-diffusion-v1-5"
v2 = false
v_parameterization = false

# ── 训练数据 ──────────────────────────────────────
[[datasets]]
  resolution = 512
  batch_size = 1

  [[datasets.subsets]]
    image_dir = "D:/learning/ObsidianVault/Paper-低慢小数据集生成架构/0-database/kohya_dataset/10_drn3_uav"
    class_tokens = "drn3_uav"
    num_repeats = 10
    is_reg = false
    caption_extension = ".txt"
    keep_tokens = 1
    flip_aug = false          # ← 关闭翻转，避免四桨无人机左右翻转后桨叶位置混淆
    color_aug = false
    face_crop_aug_range = null
    random_crop = false
    shuffle_caption = false
    token_warmup_min = 1
    token_warmup_step = 0

# ── LoRA 参数 ─────────────────────────────────────
network_module = "networks.lora"
network_dim = 16             # ← rank 8→16，更多容量学四桨结构
network_alpha = 8            # ← 对应 dim/2
network_args = []
network_weights = "D:/learning/ObsidianVault/Paper-低慢小数据集生成架构/2-Lora training/drone_target/checkpoints/checkpoint-5000/lora_weights.safetensors"
network_train_unet_only = false
network_train_text_encoder_only = false

# ── 训练超参 ──────────────────────────────────────
optimizer_type = "AdamW8bit"
learning_rate = 5e-5         # ← 1e-4 → 5e-5，有基础后降低防过拟合
lr_scheduler = "cosine_with_restarts"
lr_warmup_steps = 0
lr_scheduler_num_cycles = 3

max_train_steps = 800        # ← 追加 800 步微调（ckpt-5000 → ckpt-5800）
save_every_n_steps = 100
save_precision = "fp16"

# ── 混合精度与显存 ────────────────────────────────
mixed_precision = "fp16"
cache_latents = true
cache_latents_to_disk = true
gradient_checkpointing = true
gradient_accumulation_steps = 1
max_grad_norm = 1.0

# ── 采样验证 ──────────────────────────────────────
sample_every_n_steps = 250
sample_sampler = "euler_a"
sample_prompts = "sample_prompts.txt"

# ── 元数据 ────────────────────────────────────────
output_name = "drn3_uav_lora_v2"
output_dir = "D:/learning/ObsidianVault/Paper-低慢小数据集生成架构/2-Lora training/drone_target_v2"
logging_dir = "D:/learning/ObsidianVault/Paper-低慢小数据集生成架构/0-database/lora_logs_v2"
log_with = "tensorboard"

# ── 其他 ──────────────────────────────────────────
seed = 42
clip_skip = 1
max_token_length = 75
max_data_loader_n_workers = 1
noise_offset = 0.0
multires_noise_iterations = 0
multires_noise_discount = 0.3
min_snr_gamma = 5.0
