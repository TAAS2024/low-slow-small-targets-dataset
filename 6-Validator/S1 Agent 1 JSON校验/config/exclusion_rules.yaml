# exclusion_rules.yaml — S1 JSON 校验用互斥规则表
# 格式: {rule: [field1, value1, field2, value2], verdict: REJECT|WARN, reason: "..."}

rules:
  - fields:
      time_of_day: night
      weather: backlight
    verdict: REJECT
    reason: "逆光需要太阳光源，夜晚不存在"

  - fields:
      time_of_day: noon
      weather: foggy
    verdict: WARN
    reason: "正午辐射强，浓雾罕见但可能"

  - fields:
      scene_type: indoor
      weather: rainy
    verdict: REJECT
    reason: "室内不下雨"

  - fields:
      scene_type: indoor
      weather: snowy
    verdict: REJECT
    reason: "室内不下雪"

  - fields:
      camera.position: bottom
      elevation_deg_gt: 0
    verdict: REJECT
    reason: "底部视角不可能仰拍"

  - fields:
      time_of_day: night
      weather: clear
      scene_type: outdoor_desert
    verdict: WARN
    reason: "沙漠夜空虽可能，但视觉特征单一，建议白天生成"

# 描述关键词交叉检查规则
description_keywords:
  - keywords: ["bright sun", "sunny", "sunlight", "sunshine", "glaring", "blazing"]
    conflict_field: weather
    conflict_values: ["overcast", "rainy", "foggy", "snowy"]
    reason: "描述中出现强烈阳光关键词，但天气为非晴状态"

  - keywords: ["rain", "rainy", "drizzle", "downpour", "wet"]
    conflict_field: weather
    conflict_values: ["clear", "backlight"]
    reason: "描述中出现降雨关键词，但天气为晴天/逆光"

  - keywords: ["night", "dark", "midnight", "moonlight", "stars"]
    conflict_field: time_of_day
    conflict_values: ["morning", "noon", "afternoon", "dawn"]
    reason: "描述中出现夜晚关键词，但时间设为白天"

  - keywords: ["indoor", "room", "hall", "corridor", "warehouse", "inside"]
    conflict_field: scene_type
    conflict_values: ["outdoor_urban", "outdoor_suburban", "outdoor_rural", "outdoor_mountain", "outdoor_coastal", "outdoor_forest", "outdoor_desert"]
    reason: "描述中出现室内关键词，但场景类型设为室外"
