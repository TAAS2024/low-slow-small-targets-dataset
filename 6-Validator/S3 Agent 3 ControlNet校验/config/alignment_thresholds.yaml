# alignment_thresholds.yaml — S3 ControlNet 条件图校验阈值

# 检 1: seg 无人机位置对齐
# seg 质心 vs Agent 2 bbox 中心 → 偏差 < 帧对角线 × ratio
seg_position:
  diagonal_ratio: 0.10  # 偏差 < 对角线 10%

# 检 2: seg 边界质量
# 1px 膨胀后面积增长率。平滑块 ≤ 周长/面积 ≈ 小；锯齿/棋盘格内部空隙被填满 → 增长率大
seg_boundary:
  dilation_growth_max: 0.50  # 50% 增长率阈值

# 检 3: depth 无人机区域一致性
# depth 无人机区域均值 vs Agent 2 scale_factor
depth_alignment:
  # scale_factor 越大 → 无人机越近 → depth 均值越小
  # 用 Spearman rank correlation
  min_correlation: 0.7     # 最小 rank correlation

# 检 4: 条件图尺寸
# seg.shape == depth.shape == pose.shape
map_size:
  enforce: true
