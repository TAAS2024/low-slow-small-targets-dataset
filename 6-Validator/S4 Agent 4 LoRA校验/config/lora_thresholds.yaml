# lora_thresholds.yaml — S4 LoRA 校验阈值

# 检 1: LoRA 概念泄漏 (SSIM)
# 无人机区域 crop 与背景非重叠区域的 SSIM 相似度
concept_bleed:
  ssim_max: 0.65       # SSIM > 此值 → 概念泄漏（无人机纹理渗入背景）
  bg_sample_size: 8    # 在背景随机采样 N 个等大小 patch

# 检 2: LoRA 过拟合模式（纹理重复）
# 连续 K 帧无人机 crop 逐像素差为 0 的比例
texture_repeat:
  window_size: 5        # 连续检查 K 帧
  zero_diff_ratio: 0.80 # 零差异像素占比 > 此值 → 纹理完全重复

# 检 3: 全局色偏
# RGB 三通道均值应在合理区间内
color_cast:
  channel_min: 0.30     # 单通道均值下限（归一化 0-1）
  channel_max: 0.70     # 单通道均值上限
